<!DOCTYPE html>
<html>
<head>
  <title>Vehicle CSV Exporter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 20px; padding: 10px 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 30px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background-color: #f2f2f2; }
    @media (max-width: 600px) {
      body { margin: 10px; }
      input, select, button { font-size: 16px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <h2>Vehicle Entry Form</h2>
  
  <form id="vehicleForm">
    <label>Division <input type="text" name="Division" required></label>
    <label>Make <input type="text" name="Make" required></label>
    <label>Model <input type="text" name="Model" required></label>
    <label>Spawn Code <input type="text" name="Spawn Code" required></label>
    <label>Type
      <select name="Type" required>
        <option value="">--Select Type--</option>
        <option>Armed Response Vehicle</option>
        <option>Dual Crewed Ambulance</option>
        <option>Unmarked Emergency Response Vehicle</option>
        <option>Motorcycle</option>
        <option>Firearms Capable Vehicle</option>
      </select>
    </label>
    <label>ELS <select name="ELS"><option>YES</option><option>NO</option></select></label>
    <label>Carvariations <select name="Carvariations"><option>YES</option><option>NO</option></select></label>
    <label>Vehicles <select name="Vehicles"><option>YES</option><option>NO</option></select></label>
    <label>Boot <select name="Boot"><option>YES</option><option>NO</option></select></label>
    <label>Plate 1 <input type="text" name="Plate1"></label>
    <label>Plate 2 <input type="text" name="Plate2"></label>
    <label>Plate 3 <input type="text" name="Plate3"></label>

    <button type="button" onclick="addToTable()">Add Entry</button>
    <button type="button" onclick="exportTableToCSV()">Export to CSV</button>
  </form>

  <h3>Vehicle Data Preview</h3>
  <table id="dataTable">
    <thead>
      <tr id="headerRow"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const entries = [];
    const headers = ['Division', 'Make', 'Model', 'Spawn Code', 'Type', 'ELS', 'Carvariations', 'Vehicles', 'Boot', 'Plate1', 'Plate2', 'Plate3'];

    const headerRow = document.getElementById("headerRow");
    headers.forEach(header => {
      const th = document.createElement("th");
      th.textContent = header;
      headerRow.appendChild(th);
    });

    function addToTable() {
      const form = document.getElementById("vehicleForm");
      const formData = new FormData(form);

      const row = headers.map(field => formData.get(field) || "");
      if (!row[0] || !row[1] || !row[2] || !row[3] || !row[4]) {
        alert("Please fill in all required fields.");
        return;
      }

      entries.push(row);
      updateTable();
      form.reset();
    }

    function updateTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      entries.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function exportTableToCSV() {
      if (entries.length === 0) {
        alert("No data to export.");
        return;
      }

      let csvContent = headers.join(",") + "\n";
      entries.forEach(row => {
        csvContent += row.map(val => `"${val}"`).join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'vehicle_entries.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
